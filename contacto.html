<body class="bg-black text-light"> 
  <header class="text-center py-4 bg-black">
    <h1 class="text-danger fw-bold text-uppercase tracking-wide">Contacto</h1>
  </header>
  <nav class="navbar navbar-expand-lg bg-dark mb-4 border-top border-bottom border-danger shadow-sm">
    <div class="container-fluid justify-content-center">
      <ul class="navbar-nav">
        <li class="nav-item border-end border-secondary px-3">
          <a class="nav-link text-light text-uppercase fw-semibold" href="index.html">Inicio</a>
        </li>
        <li class="nav-item border-end border-secondary px-3">
          <a class="nav-link text-light text-uppercase fw-semibold" href="sobrenosotros.html">Quiénes Somos</a>
        </li>
        <li class="nav-item px-3">
          <a class="nav-link text-danger fw-bold text-uppercase" href="contacto.html">Contacto</a>
        </li>
      </ul>
    </div>
  </nav>
  <div class="container-fluid">
    <div class="row text-center" style="min-height: 50vh;">
      <div class="col-2 bg-secondary d-flex align-items-center justify-content-center border border-dark">
        <h3 class="text-light opacity-50">Anuncios...</h3>
      </div>
      <div class="col-8 bg-dark text-light text-start p-5 border border-danger shadow-lg">
        <div id="cajaAlerta"></div>
        <h2 class="text-danger fw-bold border-bottom border-secondary pb-2 mb-4 text-center">Formulario de contacto</h2>
        <p class="text-light text-center mb-4">Llena los campos del siguiente formulario.</p>
        <form id="formularioUmbrella">
          <div class="mb-3">
            <label for="emailInput" class="form-label fw-bold text-danger">Correo</label>
            <input type="email" class="form-control bg-dark text-light border-secondary" id="emailInput" placeholder="agente@umbrella-corp.com" required>
          </div>
          <div class="mb-4">
            <label for="mensajeInput" class="form-label fw-bold text-danger">Mensaje</label>
            <textarea class="form-control bg-dark text-light border-secondary" id="mensajeInput" rows="4" placeholder="Describa la mutación o evento..." required></textarea>
          </div>
          <div class="text-center">
            <button type="button" class="btn btn-primary fw-bold px-4" id="btnEnviar">Enviar</button>
          </div>
        </form>
      </div>
      <div class="col-2 bg-secondary d-flex align-items-center justify-content-center border border-dark">
        <h3 class="text-light opacity-50">Noticias</h3>
      </div>
    </div>
  </div>
  <footer class="bg-dark text-light text-center py-4 mt-4 border-top border-danger shadow-lg">
    <p class="mb-1 fw-bold text-uppercase text-danger">Resident evil</p>
    <p class="mb-1 fw-semibold">Redactor: Alexis Castillo Netzahualcoyotzi</p>
    <p class="mb-0 text-secondary">Correo: ciberart@umbrellacorp.com</p>
  </footer>
